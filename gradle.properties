# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# SpaceSaver
# Base package, namespace, and application ID (plan Section 14, decision 1).
# Changing it also requires moving the Kotlin source folders to the new package path.
spacesaver.namespace=io.github.gokulhk.spacesaver
